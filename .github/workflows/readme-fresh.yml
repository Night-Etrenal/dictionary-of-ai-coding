name: README freshness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck generator
        run: npx tsc -p internal/tsconfig.json
      - name: Regenerate README
        run: npm run generate
      - name: Fail if README.md is out of sync
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "README.md is out of sync with dictionary/, internal/Curriculum.md, or internal/README.template.md."
            echo "Run: npm run generate && commit the result."
            exit 1
          fi
